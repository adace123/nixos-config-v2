name: Build ARM SD Image
on:
  workflow_dispatch:
    inputs:
      host:
        description: "NixOS configuration to build (must have a '-sd-image' variant in flake-parts/nixos.nix)"
        default: "coruscant"
        type: string
  push:
    branches:
      - main
    paths:
      # Only rebuild when something the image depends on changes. The sd-image config
      # pulls in installer.nix + common.nix; add hosts/<arm-host>/** paths here as
      # more ARM hosts gain '-sd-image' variants.
      - ".github/workflows/build-sd-image.yml"
      - "flake.nix"
      - "flake.lock"
      - "flake-parts/nixos.nix"
      - "hosts/coruscant/**"
      - "hosts/threepio/**"
      - "hosts/default.nix"
      - "modules/nixos/common.nix"
      - "modules/nixos/installer.nix"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.host || 'coruscant' }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  IMAGE_HOST: ${{ inputs.host || 'coruscant' }}
jobs:
  build:
    # Native arm64 runner — no QEMU emulation, sandbox stays enabled, and the
    # default system is already aarch64-linux (no --system flag needed).
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          flakehub: false
      - name: Build SD image
        run: |
          # IMAGE_HOST comes from a workflow_dispatch input: read it as a shell
          # variable here, never interpolate a workflow expression into a run
          # block (that is what zizmor's template-injection audit flags).
          nix build ".#nixosConfigurations.${IMAGE_HOST}-sd-image.config.system.build.sdImage" \
            --print-build-logs \
            --accept-flake-config
      - name: Collect image and checksums
        run: |
          set -euo pipefail
          mkdir -p /tmp/artifact
          IMG="$(find result/sd-image -name '*.img.zst' -print -quit)"
          cp "$IMG" /tmp/artifact/
          cd /tmp/artifact
          IMG_BASENAME="$(basename "$IMG")"
          sha256sum "$IMG_BASENAME" > sha256sums.txt
          {
            echo "image: $IMG_BASENAME"
            echo "compressed size (bytes): $(stat -c%s "$IMG_BASENAME")"
            unzstd -l "$IMG_BASENAME" | tail -n +2
          } > image-info.txt
      - name: Publish build summary
        run: |
          set -euo pipefail
          IMG_BASENAME="$(basename "$(find result/sd-image -name '*.img.zst' -print -quit)")"
          {
            echo "## SD image build: \`$IMAGE_HOST\`"
            echo ""
            echo "- Image: \`$IMG_BASENAME\`"
            echo "- SHA-256: \`$(awk '{print $1}' /tmp/artifact/sha256sums.txt)\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          # Name includes the commit SHA so distinct builds never collide
          # (keep in sync with the `nixos-build-ci` just recipe's download name)
          name: nixos-sd-image-${{ env.IMAGE_HOST }}-${{ github.sha }}
          path: /tmp/artifact/*
          if-no-files-found: error
          retention-days: 14
