name: Build and Deploy OCI Image
"on":
  # Paused (2025-08-14): auto-run on push disabled. Only manual runs via
  # workflow_dispatch (Actions tab) until re-enabled. See docs/deployment.md.
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply after planning"
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: oci-deploy
  cancel-in-progress: false
env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
jobs:
  # No image is built here any more: an Always Free tenancy has
  # custom-image-count = 0, so a built qcow2 cannot be imported as a custom image
  # (CreateImage fails with 400-QuotaExceeded). The instance boots an Oracle
  # platform image, and scripts/dathomir-convert.sh converts it to NixOS in place
  # — operator-run over the tailnet, since the instance has no public IP.
  # See docs/dathomir.md.
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup SOPS age key
        run: |
          echo "${{ secrets.SOPS_AGE_KEY }}" > /tmp/age-key.txt
          chmod 600 /tmp/age-key.txt
          echo "SOPS_AGE_KEY_FILE=/tmp/age-key.txt" >> "$GITHUB_ENV"
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
        with:
          flakehub: false
      - name: OpenTofu Init
        working-directory: infra
        run: nix develop "${{ github.workspace }}#infra" -c env OCI_SECRETS_FILE=../secrets/oci.yaml ./tofu-env.sh init
      - name: OpenTofu Plan
        working-directory: infra
        run: nix develop "${{ github.workspace }}#infra" -c env OCI_SECRETS_FILE=../secrets/oci.yaml ./tofu-env.sh tofu plan -input=false -no-color
  apply:
    needs:
      - plan
    if: github.event_name == 'workflow_dispatch' && inputs.apply
    runs-on: ubuntu-latest
    environment: oci-production
    steps:
      - uses: actions/checkout@v7
      - name: Setup SOPS age key
        run: |
          echo "${{ secrets.SOPS_AGE_KEY }}" > /tmp/age-key.txt
          chmod 600 /tmp/age-key.txt
          echo "SOPS_AGE_KEY_FILE=/tmp/age-key.txt" >> "$GITHUB_ENV"
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
        with:
          flakehub: false
      - name: OpenTofu Init
        working-directory: infra
        run: nix develop "${{ github.workspace }}#infra" -c env OCI_SECRETS_FILE=../secrets/oci.yaml ./tofu-env.sh init
      # `plan-apply` plans and applies in one process so the temporary OCI
      # private-key path matches. A1 free-tier capacity is scarce: "Out of host
      # capacity" is expected and retried with `just -f infra/justfile apply-retry`
      # (which cycles fault domains) rather than in CI.
      - name: OpenTofu Plan
        working-directory: infra
        run: nix develop "${{ github.workspace }}#infra" -c env OCI_SECRETS_FILE=../secrets/oci.yaml ./tofu-env.sh plan-apply
      - name: OpenTofu Apply Completed
        working-directory: infra
        run: true
