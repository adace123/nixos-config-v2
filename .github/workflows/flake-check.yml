name: Flake Checks
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
        with:
          flakehub: false
      - name: Flake eval smoke check
        run: nix flake show
      # Guard the documented duplication: flake.nix's literal nixConfig must
      # match nix-caches.nix (nix cannot evaluate imports for nixConfig).
      - name: Check nixConfig / nix-caches.nix sync
        run: ./scripts/check-nix-caches-sync.sh
  linux-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
        with:
          flakehub: false
      # Evaluate every system's outputs, but build none of them. A *build* step
      # must never pass --all-systems: the checks are per-system derivations, so
      # building e.g. checks.aarch64-darwin.pre-commit here dies with
      # "platform mismatch" (there is no remote builder for foreign systems).
      # That regression landed once already in edb59fd; it was fixed in 9cd8e0d.
      - name: Evaluate Nix flake (all systems)
        run: nix flake check --all-systems --no-build
      # Native x86_64-linux build: realises checks.x86_64-linux.pre-commit, which
      # runs the whole pre-commit hook suite over the tree.
      - name: Check Nix flake (Linux)
        run: nix flake check
  # Eval-only smoke of the darwin configuration. A full `nix flake check` here
  # would re-evaluate every system and burn macOS runner minutes; the real build
  # is the separate `darwin-build` job below.
  darwin-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
        with:
          flakehub: false
      - name: Evaluate darwin configuration (endor)
        run: |
          nix eval .#darwinConfigurations.endor.config.system.build.toplevel.drvPath \
            --accept-flake-config
  # `darwin-check` only evaluates the top-level derivation. That catches option
  # and type errors, but not the failure class a flake input bump actually
  # produces: a package that no longer builds, or an activation script that
  # breaks. Realising the system output is the only thing that catches it.
  #
  # This is a required check in the `Main` ruleset: measured at ~15 minutes cold
  # on a public repo, where macOS runner minutes are free. Repository admins
  # bypass the ruleset, so a slow or flaky run here blocks Dependabot PRs, not
  # local pushes.
  darwin-build:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
        with:
          flakehub: false
      - name: Build darwin configuration (endor)
        run: nix build .#darwinConfigurations.endor.system --accept-flake-config --no-link
