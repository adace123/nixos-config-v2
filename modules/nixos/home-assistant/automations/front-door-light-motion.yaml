- id: "front_door_light_motion"
  alias: "Front Door Light on Motion after Sunset"
  description: "Turn on the front door light immediately for 30 seconds when the Ring doorbell detects motion after sunset."
  mode: "restart"
  max_exceeded: silent
  trigger:
    - platform: state
      entity_id: event.front_door_front_doorbell_motion
  condition:
    - condition: sun
      after: sunset
  action:
    - action: light.turn_on
      target:
        entity_id: light.front_door_light
    - delay: "00:00:30"
    - action: light.turn_off
      target:
        entity_id: light.front_door_light
