- id: "coruscant_cpu_high"
  alias: "Coruscant - High CPU"
  description: "Alert when Coruscant CPU usage remains high."
  mode: "single"
  trigger:
    - platform: numeric_state
      entity_id: sensor.system_monitor_processor_use
      above: 90
      for:
        minutes: 10
  action:
    - action: persistent_notification.create
      data:
        notification_id: coruscant_cpu_high
        title: "Coruscant CPU usage high"
        message: "CPU usage has been above 90% for 10 minutes (currently {{ states('sensor.system_monitor_processor_use') }}%)."
    - action: notify.mobile_app_aaron_cell
      data:
        title: "Coruscant CPU usage high"
        message: "CPU usage has been above 90% for 10 minutes (currently {{ states('sensor.system_monitor_processor_use') }}%)."
