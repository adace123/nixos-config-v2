# herdr-kanban settings
#
# This file is repo-managed (modules/home/ai/herdr/plugins/kanban/config.toml)
# and is copied to the plugin config dir (~/.config/herdr/plugins/config/
# herdr-kanban/) on every activation, so editing it here is the source of
# truth. Every key is optional — a missing file or key falls back to the same
# defaults baked into the app.

[ui]
# "overlay" fills the active pane and restores focus/zoom on close (the
# manifest default); "popup" opens a centred session-modal of width/height.
placement = "overlay"
width = "95%"
height = "90%"
# Quick capture (the `herdr-kanban.quick-add` action, bound to prefix+shift+k)
# gets its own geometry: a centred popup with just the add form is the point of
# a capture shortcut, so it defaults to a popup whatever `placement` says.
quick_add_placement = "popup"
quick_add_width = "80%"
quick_add_height = "75%"
# Spin the working indicator on cards whose agent is busy.
animate = true
# Show how long each card has been sitting there (omitted under 90s, since "0s"
# is noise). Ages are tinted once they pass stale_after_days below.
show_age = true
# The rest of the card's meta row: the agent's mark (`π`), optionally with the
# kind beside it (`π pi`), and the live status word on the card's bottom rule
# (`◐ working`), which has room at every column width. The mark is always there —
# these keys only hide *words*.
#
# Off by default: the mark is already unique per kind (and tinted with the
# vendor's colour), and the name costs four to eight cells that the workspace
# label, the age and the step counter want more. The name is still on the detail
# view (`⏎`), in both agent pickers, and in `herdr-kanban list`/`show`, so nothing
# is lost — it is only kept off the tightest row. Turn it back on if you do not
# recognise the marks yet.
show_agent_kind = false
show_status_word = true
# Agent glyphs: "brand" uses the HerdrAgentIconsMax font (installed by
# herdr-radar) when it is available, and "unicode" always uses herdr-radar's
# text marks — the same ones its sidebar falls back to.
icon_mode = "brand"

[board]
# Columns, in order. `id` is what lives in the board file, `label` is the
# heading. Renaming or removing a column that still has tasks hides those
# cards, so clear them first.
#
# `role` names what a column *means* and is optional, but it is what keeps
# behaviour attached to the column rather than its id: with `role = "done"`
# agents still cannot close a card after you rename the id to `closed`, `block`
# still parks in the `blocked`-role column, and the dispatch protocol sends
# finished work to the `review`-role column. Without a role the board falls
# back to matching the id (`done`, `closed`, `complete`, `completed` for Done;
# `blocked`/`waiting`/`on-hold`/`hold`; `review`/`reviewing`/`verify`/
# `validation`; `doing`/`in-progress`/`progress`/`started` for a send;
# `queued`/`todo`/`next`/`ready` for Queued).
#
# The `done` role is the one column only you may move a card into; every other
# column is in the `agent_may_set` the CLI advertises and the set the guard
# enforces. `doing` is also where a send lands: a send starts the card's agent,
# so it goes to In Progress wherever it came from. `queued` is a column you
# park committed-but-unstarted work in by hand — the board moves a card out of
# it if its agent turns out to be working.
columns = [
  { id = "backlog", label = "Backlog" },
  { id = "queued", label = "Queued", role = "queued" },
  { id = "doing", label = "In Progress", role = "doing" },
  { id = "blocked", label = "Blocked", role = "blocked" },
  { id = "review", label = "Review", role = "review" },
  { id = "done", label = "Done", role = "done" },
]
# Agent kind pre-selected in the add form, and the column new tasks land in.
default_agent = "pi"
default_column = "backlog"
# Optional per-column card limits, shown as "3/5" and highlighted when full.
# wip_limits = { doing = 5 }
# Cards untouched for this many days are tinted yellow, and red at 2x.
stale_after_days = 3

# Short codes for card ids. A card is filed as `<code>-<counter>` (`snow-8`): the
# code of the workspace it was filed in, then this board's one ever-growing
# counter, which is what makes `8` alone name exactly one card. Without an entry
# here a workspace codes by its own label, slugified and cut to six characters
# (`nixos-config-v2` -> `nixos`), which reads fine for a short label and badly
# for a long one — hence the table below. Key an entry by the label, or by
# herdr's workspace id (`w1 = "cfg"`) — the id survives a `herdr workspace
# rename`, which the label does not. The code is frozen into the id when the
# card is filed; changing it here only affects new cards.
[workspaces]
enrollment = "enrol"          # `enroll` is cut to six, which reads like a typo
webapp = "web"                # `webap` is not a word
snowflake-reporting = "snow"  # `snowfl` is not a word either
commerce = "comm"
jupyter = "jupy"              # `jupite` is a truncation, not an abbreviation
incentive = "inc"
personal = "pers"
# Left to the fallback: nixos-config-v2 -> `nixos`, and the labels that are
# already short enough to be their own code (`work`, `argo`).

[behavior]
# How often the board re-reads live agent and workspace state, in seconds.
sync_seconds = 2.0
# How often workspaces are re-read separately (they change far less often):
# agent state keeps to sync_seconds, workspaces to this, so a tick does not pay
# for a `herdr workspace list` it does not need.
workspace_sync_seconds = 10.0
# Raise a herdr notification when an agent newly blocks on you. Only transitions
# are announced, so opening the board onto a blocked card stays quiet.
notify_on_block = true
# Say so when an agent files a card (`herdr-kanban add "<title>"`, what the
# protocol below tells it to do with work it found). The CLI's own `created_by`
# decides, so a card captured in the board's form is never announced.
notify_on_add = true
# The delivery switch for both of the above: also ask the desktop (macOS
# Notification Center via terminal-notifier or osascript, notify-send on Linux),
# because the herdr toast only reaches someone already looking at herdr. A card
# an agent files raises no toast at all, so for that one this key is the only
# delivery there is.
notify_system = true
# When true, a card moves to "doing" as soon as its dispatched agent starts
# working (a card parked in Blocked by hand stays there until that working phase
# ends), and to "review" when the agent finishes without an error. Off by
# default: the board is yours to move, and agents that follow the protocol
# below move their own cards explicitly instead.
auto_move = false
# Deleting a card (`d`) also stops its agent by closing the tab its dispatch
# opened: a card is the record of a run, and a card that is gone should not
# leave an agent nobody is tracking. Set to false to delete the card and leave
# the agent running — the confirmation says which it will do.
auto_delete_agent = true
# Append the board protocol to every dispatch prompt: the task id, the
# `herdr-kanban status|block|note|title` commands, and the rule that only you
# close a card. Set to false for a prompt that is only the task text.
announce_protocol = true
# Whether an agent's generated title replaces one you set by hand, on the card
# and on the herdr tab the dispatch opened. On: the card is named by what the
# work turned out to be, and the title you had typed is kept in the card's
# history (`was: …`). Off (the default): a title you typed wins, and an agent's
# name is recorded under Updates as a suggestion instead. `--force` on one
# `herdr-kanban title` call does the same as on, for that call alone.
agent_title_overrides = true
# Whether the send form's **Git worktree** option is already ticked when it
# opens. Off by default: a worktree changes where the agent runs — a fresh
# checkout instead of the workspace you are in — which is worth a deliberate
# click. A card that already owns a worktree always opens with the option on,
# because the checkout is where its work lives.
worktree = false

# Flags handed to the agent when the board starts it — the same ones you would
# type after `herdr agent start … --`. Without these a dispatched agent runs
# with none of the flags you use interactively.
#
# A card can also carry its own model (`Model` in the add/edit form, `--model` on
# the CLI), which *replaces* a `--model` pair here rather than adding a second
# one — two of them in one argv is a last-wins coin toss.
#
# [agents.claude]
# args = ["--permission-mode=auto"]
#
# [agents.pi]
# args = ["--model", "deepseek-v4-flash"]
#
# [agents.codex]
# args = ["--full-auto"]

# Model names the add/edit form offers, per agent kind, in this order. They are
# passed to the CLI verbatim, so only list what the agent you have actually
# accepts — a name it rejects fails at `agent start`, where the board names the
# step that broke. A kind with no list (or no `[models]` at all) offers just
# `default`, meaning "whatever `[agents.<kind>] args` already say".
[models]
claude = ["sonnet", "opus", "haiku"]
# Provider-qualified, because a bare id can exist under more than one provider
# (`deepseek-v4-flash` is in both `opencode` and `opencode-go`) and `--model`
# goes to the CLI verbatim. First entry is the one this box runs by default.
pi = [
  "opencode-go/deepseek-v4.1-flash",
  "opencode-go/deepseek-v4-flash",
  "opencode-go/glm-5.3-flash",
  "opencode-go/glm-5.3",
  "opencode-go/kimi-k2.7-code",
  "opencode-go/minimax-m3",
  "opencode-go/grok-4.6",
  "opencode-go/qwen3.7-max",
]
# codex = ["gpt-5-codex"]
# opencode = ["opencode/deepseek-v4-flash-free"]
